name: Build desktop apps

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-app/**'
      - 'Sources/AgentLightDaemon.swift'
      - 'agent_light.py'
      - 'device.id'
      - '.github/workflows/build-desktop.yml'

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - name: Compile CoreBluetooth backend
        run: ../build_daemon.sh ../.build/agent-light-daemon
      - run: npm ci
      - run: npm run check
      - name: Build DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: CodeLight-macOS
          path: |
            desktop-app/dist/*.dmg
            desktop-app/dist/*.zip

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Build installer and portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: CodeLight-Windows
          path: desktop-app/dist/*.exe
